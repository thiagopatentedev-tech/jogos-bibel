<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Jogos da Bibel</title><meta name="description" content="Coleção de joguinhos de alfabetização para crianças, feitos com IA."><meta property="og:title" content="Jogos da Bibel"><meta property="og:description" content="Joguinhos de alfabetização feitos com IA."><meta property="og:image" content="https://www.thiagopatente.com.br/jogo/og.png"><meta property="og:type" content="website"><meta property="og:url" content="https://www.thiagopatente.com.br/jogo/"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://www.thiagopatente.com.br/jogo/og.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css?v=5"><script src="assets/mascotes.js"></script><script src="assets/glyph.js"></script><style>
.head{text-align:center;padding:18px 0 6px}.head .k{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--coral);font-weight:600}
.head h1{font-size:clamp(40px,12vw,64px);letter-spacing:-.015em}.head p{color:var(--ink-soft);font-size:17px;font-weight:500}
.turmabar{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 4px;flex-wrap:wrap}
.turmabtn{border:3px solid var(--line);background:var(--card);border-radius:999px;padding:12px 20px;font-family:inherit;font-weight:700;font-size:16px;color:var(--tinta);cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:var(--clay-press)}
.turmabtn:active{transform:translateY(2px)}
.turmabtn.on{background:var(--coral);color:#fff;border-color:var(--coral)}
.turmaface{display:inline-flex;margin-right:2px}
.turmahint{text-align:center;color:var(--ink-soft);font-size:13px;margin:2px 0 0}
.secttl{font-weight:700;font-size:14px;color:var(--terra);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 8px;grid-column:1/-1;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
@media(min-width:560px){.grid2{grid-template-columns:1fr 1fr 1fr}}
.tile{background:var(--card);border:3px solid var(--line);border-radius:var(--r-md);padding:18px 12px;text-align:center;text-decoration:none;color:var(--tinta);box-shadow:var(--clay);transition:transform .12s var(--ease-out),box-shadow .12s var(--ease-out)}
.tile:active{transform:translateY(3px);box-shadow:var(--clay-press)}.tile .te{font-size:46px}.tile .tt{font-weight:700;font-size:19px;color:var(--terra);margin-top:6px}.tile .td{font-size:13px;color:var(--ink-soft);margin-top:2px;line-height:1.3}
.foot{text-align:center;color:var(--ink-soft);font-size:13px;margin:26px 0 10px}
.profilebar{display:flex;align-items:center;justify-content:center;gap:10px;margin:20px 0 2px;flex-wrap:wrap}
.profilebar .lbl{font-size:13px;color:var(--ink-soft);font-weight:600}
.agebtn{border:3px solid var(--line);background:var(--card);border-radius:999px;width:36px;height:36px;font-weight:700;font-size:14px;color:var(--ink-soft);cursor:pointer}
.agebtn.on{background:var(--coral);color:#fff;border-color:var(--coral)}
.today{margin:14px 0 2px}
.today a{display:flex;align-items:center;gap:14px;background:var(--card);border:3px solid var(--coral);border-radius:var(--r-md);padding:14px 16px;text-decoration:none;color:var(--tinta);box-shadow:var(--clay)}
.today a:active{transform:translateY(3px);box-shadow:var(--clay-press)}
.today .te{font-size:44px;flex:none}.today .te .gly{width:1em;height:1em}
.today .meta{text-align:left}.today .k{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);font-weight:700}
.today .tt{font-weight:700;font-size:19px;color:var(--terra);margin-top:2px}
.stickers{margin:20px 0 2px;text-align:center}
.stickers .lbl{font-size:13px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:8px}
.stickers .shelf{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.stickers .fig{width:46px;height:46px;border:3px solid var(--line);border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;box-shadow:var(--clay-press)}
.stickers .fig .gly{width:26px;height:26px}
.timebtn{border:3px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-family:inherit;font-weight:700;font-size:13px;color:var(--ink-soft);cursor:pointer}
.timebtn.on{background:var(--coral);color:#fff;border-color:var(--coral)}
.sheetcard{max-height:88vh;overflow-y:auto}
.parentctl{margin-top:18px;border-top:2px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.parentctl .pctitle{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
.parentctl .pcrow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.parentctl .lbl{font-size:12px;color:var(--ink-soft);font-weight:600}
</style></head><body>
<button class="lang-btn" id="langBtn" aria-label="Português / English" style="position:absolute;top:12px;right:12px"><span class="flag pt on"></span><span class="flag en"></span></button>
<button class="info-btn" id="infoBtn" aria-label="Sobre" style="position:absolute;top:12px;left:12px">ⓘ</button>
<div class="sheet" id="aboutSheet">
 <div class="sheetcard">
  <button class="closex" id="closeAbout">✕</button>
  <div class="big">🧸</div>
  <h2 id="aboutH2">Sobre</h2>
  <p id="aboutP"></p>
  <div class="parentctl" id="parentctl"></div>
 </div>
</div>
<div class="wrap">
 <div class="head"><div class="k">Jogos da Bibel</div><h1 id="h1">Aprender brincando</h1><p id="tag">joguinhos de alfabetização, feitos com IA</p></div>
 <div class="today" id="today"></div>
 <div class="turmabar">
  <button class="turmabtn" id="turmaM2" data-t="m2"><span class="turmaface" id="faceM2"></span><span></span></button>
  <button class="turmabtn" id="turmaP2" data-t="p2"><span class="turmaface" id="faceP2"></span><span></span></button>
 </div>
 <p class="turmahint" id="turmaHint"></p>
 <div class="grid2" id="grid"></div>
 <div class="stickers" id="stickers"></div>
 <div class="foot" id="foot">Feito por Thiago Patente, para as duas filhas. · <a href="https://www.thiagopatente.com.br" style="color:var(--terra)">thiagopatente.com.br</a></div>
</div>
<script>
var TILES=[
 {turma:"p2",href:"v1/copa/",e:"🏆",pt:["Bia e as Bandeiras do Mundo","memória das bandeiras do mundo"],en:["Bia and the World Flags","world flags memory match"]},
 // Maternal II
 {turma:"m2",href:"cores/",e:"🎨",pt:["As Cores","toque na cor que eu falar"],en:["Colors","touch the color I say"]},
 {turma:"m2",href:"contar/",e:"🔢",pt:["Conta os Bichos","conte e toque no número certo"],en:["Count the Animals","count and touch the right number"]},
 {turma:"m2",href:"diferente/",e:"🍎🍎🍌",pt:["Qual é Diferente","toque no que é diferente"],en:["Odd One Out","touch the one that's different"]},
 {turma:"m2",href:"sombras/",e:"🦆🌑",pt:["A Sombra Certa","ache cada figura e a sua sombra"],en:["Right Shadow","match each picture to its shadow"]},
 {turma:"m2",href:"sequencia/",e:"1️⃣2️⃣3️⃣",pt:["A Sequência","coloque os números em ordem"],en:["The Sequence","put the numbers in order"]},
 {turma:"m2",href:"tamanhos/",e:"📏",pt:["Tamanhos","toque no maior ou no menor"],en:["Sizes","touch the bigger or smaller one"]},
 {turma:"m2",href:"sons-dos-bichos/",e:"🐮",pt:["Sons dos Bichos","toque no bicho que faz o som"],en:["Animal Sounds","touch the animal that makes the sound"]},
 {turma:"m2",href:"formas/",e:"🔺",pt:["Formas","toque na forma certa"],en:["Shapes","touch the right shape"]},
 {turma:"m2",href:"opostos/",e:"⚖️",pt:["Opostos","qual é o oposto?"],en:["Opposites","what is the opposite?"]},
 {turma:"m2",href:"partes-do-corpo/",e:"🧑",pt:["Partes do Corpo","toque na parte certa do corpo"],en:["Body Parts","touch the right body part"]},
 {turma:"m2",href:"emocoes/",e:"😀",pt:["Emoções","toque em quem está sentindo isso"],en:["Feelings","touch the one feeling that way"]},
 {turma:"m2",href:"rotina/",e:"☀️",pt:["Rotina","manhã, tarde ou noite?"],en:["Daily Routine","morning, afternoon or night?"]},
 // Pré II
 {turma:"p2",href:"rimas/",e:"🦆🐱",pt:["As Rimas","memória das palavras que rimam"],en:["Rhymes","memory match of rhyming words"]},
 {turma:"p2",href:"som-da-letra/",e:"🔤",pt:["O Som da Letra","qual figura começa com a letra"],en:["Letter Sound","which picture starts with the letter"]},
 {turma:"p2",href:"primeira-letra/",e:"🅰️",pt:["A Primeira Letra","com que letra a palavra começa"],en:["First Letter","which letter the word starts with"]},
 {turma:"p2",href:"silabas/",e:"🍌",pt:["Monta a Sílaba","junte as sílabas e forme a palavra"],en:["Build the Syllable","put the syllables together"]},
 {turma:"p2",href:"caca-letra/",e:"🔎",pt:["Caça à Letra","toque em todas as letras iguais"],en:["Letter Hunt","touch all the matching letters"]},
 {turma:"p2",href:"padroes/",e:"🔴🔵",pt:["Padrões","complete o padrão"],en:["Patterns","complete the pattern"]},
 {turma:"p2",href:"soma-facil/",e:"➕",pt:["Soma Fácil","conte e responda"],en:["Easy Addition","count and answer"]},
 {turma:"p2",href:"qual-palavra/",e:"🔤",pt:["Qual Palavra?","escolha a palavra certa"],en:["Word Match","pick the right word"]},
 {turma:"p2",href:"maior-grupo/",e:"🔢",pt:["Maior Grupo","compare as quantidades"],en:["Which Group Has More","compare the quantities"]},
 {turma:"p2",href:"ingles-pra-figura/",e:"🔤",pt:["Do Inglês pra Figura","ouça em inglês e toque na figura certa"],en:["English by Ear","listen in English and touch the right picture"]},
 {turma:"p2",href:"tracar-numeros/",e:"🔢",pt:["Traçar Números","ligue os pontos e trace o número"],en:["Trace Numbers","connect the dots and trace the number"]},
 {turma:"m2",href:"guarda-as-coisas/",e:"🧺",pt:["Guarda as Coisas","arraste cada coisa pro lugar certo"],en:["Put Things Away","drag each thing to the right place"]},
 {turma:"p2",href:"junta-os-sons/",e:"🔤",pt:["Junta os Sons","junta os sons e forma a palavra"],en:["Blend the Sounds","blend the sounds into a word"]},
 {turma:"p2",href:"faz-dez/",e:"🔟",pt:["Faz Dez","quantos faltam pra dez?"],en:["Make Ten","how many to make ten?"]}
];
var HEAD={pt:{h1:"Aprender brincando",tag:"joguinhos de alfabetização, feitos com IA",foot:'Feito por Thiago Patente, para as duas filhas. · <a href="https://www.thiagopatente.com.br" style="color:var(--terra)">thiagopatente.com.br</a>',profileLbl:"toque maior pra mãozinha pequena?",m2:"Maternal II",p2:"Pré II",hintOn:"mostrando só os jogos da ",hintOff:"toque numa turma pra ver só os jogos dela.",sectRec:"recomendados pra essa turma",sectOther:"outros jogos",aboutH2:"Sobre os Jogos da Bibel",aboutP:"Uma coleção de joguinhos de alfabetização e matemática, feitos por Thiago Patente com IA, pra suas duas filhas praticarem em português e inglês no celular. Nada de anúncio, nada de cadastro, é só brincar.",today:"jogo de hoje",figs:"suas figurinhas",tempo:"tempo de brincar",livre:"livre",calm:"modo calmo",calmOff:"desligado",calmOn:"ligado",ajustes:"ajustes pra adultos"},
 en:{h1:"Learn by playing",tag:"early learning games, made with AI",foot:'Made by Thiago Patente, for his two daughters. · <a href="https://www.thiagopatente.com.br" style="color:var(--terra)">thiagopatente.com.br</a>',profileLbl:"bigger buttons for a little hand?",m2:"Maternal II",p2:"Pre II",hintOn:"showing only games for ",hintOff:"tap a class to see only its games.",sectRec:"recommended for this class",sectOther:"other games",aboutH2:"About Jogos da Bibel",aboutP:"A collection of early literacy and math games, made by Thiago Patente with AI, for his two daughters to practice in Portuguese and English on the phone. No ads, no sign-up, just play.",today:"today's game",figs:"your stickers",tempo:"play time",livre:"free",calm:"calm mode",calmOff:"off",calmOn:"on",ajustes:"grown-up settings"}};
function getLang(){try{return localStorage.getItem('bibel_lang')||'pt';}catch(e){return 'pt';}}
function setLang(l){try{localStorage.setItem('bibel_lang',l);}catch(e){}}
function getProfile(){try{return localStorage.getItem('bibel_profile')||'';}catch(e){return '';}}
function setProfile(p){try{if(p)localStorage.setItem('bibel_profile',p);else localStorage.removeItem('bibel_profile');}catch(e){}}
function getTurma(){try{return localStorage.getItem('bibel_turma')||'';}catch(e){return '';}}
function setTurma(t){try{if(t)localStorage.setItem('bibel_turma',t);else localStorage.removeItem('bibel_turma');}catch(e){}}
var lang=getLang();
var profile=getProfile();
var turma=getTurma();
function slugOf(h){return h.replace(/\.\.\//g,'').replace(/\//g,'');}
function dayIndex(n){var d=new Date();var str=''+(d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate());var x=0;for(var i=0;i<str.length;i++)x=(x*31+str.charCodeAt(i))>>>0;return x%n;}
function renderToday(){
 var el=document.getElementById('today');if(!el)return;
 var t=TILES[dayIndex(TILES.length)];var d=t[lang];
 el.innerHTML='<a href="'+t.href+'"><span class="te">'+(window.glyph?window.glyph(t.e):t.e)+'</span>'
  +'<span class="meta"><span class="k">'+HEAD[lang].today+'</span><span class="tt">'+d[0]+'</span></span></a>';
}
function getStickers(){try{return JSON.parse(localStorage.getItem('bibel_stickers')||'[]');}catch(e){return [];}}
function renderStickers(){
 var el=document.getElementById('stickers');if(!el)return;var arr=getStickers();
 if(!arr.length){el.innerHTML='';return;}
 var byslug={};TILES.forEach(function(t){byslug[slugOf(t.href)]=t;});
 var figs=arr.map(function(s){var t=byslug[s];var e=t?t.e:'⭐';return '<span class="fig">'+(window.glyph?window.glyph(e):e)+'</span>';}).join('');
 el.innerHTML='<span class="lbl">'+HEAD[lang].figs+'</span><div class="shelf">'+figs+'</div>';
}
function getTime(){try{return localStorage.getItem('bibel_screentime')||'';}catch(e){return '';}}
function setTime(v){try{if(v)localStorage.setItem('bibel_screentime',v);else localStorage.removeItem('bibel_screentime');}catch(e){}}
function getCalm(){try{return localStorage.getItem('bibel_calm')==='1';}catch(e){return false;}}
function setCalm(v){try{if(v)localStorage.setItem('bibel_calm','1');else localStorage.removeItem('bibel_calm');}catch(e){}
 document.documentElement.toggleAttribute('data-calm',!!v);}
function renderParentCtl(){
 var el=document.getElementById('parentctl');if(!el)return;
 var H=HEAD[lang];var t=getTime();var c=getCalm();
 var timeOpts=[['',H.livre],['10','10'],['15','15'],['20','20']];
 el.innerHTML='<div class="pctitle">'+H.ajustes+'</div>'
  +'<div class="pcrow"><span class="lbl">'+H.profileLbl+'</span>'
   +'<button class="agebtn'+(profile==='p3'?' on':'')+'" data-p="p3">3</button>'
   +'<button class="agebtn'+(profile==='p5'?' on':'')+'" data-p="p5">5</button></div>'
  +'<div class="pcrow"><span class="lbl">'+H.tempo+':</span>'
   +timeOpts.map(function(o){return '<button class="timebtn'+(t===o[0]?' on':'')+'" data-v="'+o[0]+'">'+o[1]+'</button>';}).join('')+'</div>'
  +'<div class="pcrow"><span class="lbl">'+H.calm+':</span>'
   +'<button class="calmbtn'+(!c?' on':'')+'" data-c="0">'+H.calmOff+'</button>'
   +'<button class="calmbtn'+(c?' on':'')+'" data-c="1">'+H.calmOn+'</button></div>';
 el.querySelectorAll('.agebtn').forEach(function(b){b.onclick=function(){var p=b.dataset.p;profile=profile===p?'':p;setProfile(profile);document.documentElement.setAttribute('data-profile',profile);renderParentCtl();};});
 el.querySelectorAll('.timebtn').forEach(function(b){b.onclick=function(){setTime(b.dataset.v);renderParentCtl();};});
 el.querySelectorAll('.calmbtn').forEach(function(b){b.onclick=function(){setCalm(b.dataset.c==='1');renderParentCtl();};});
}
function tile(t){
 var d=t[lang];
 var a=document.createElement('a');a.className='tile';a.href=t.href;
 a.innerHTML='<div class="te">'+(window.glyph?window.glyph(t.e):t.e)+'</div><div class="tt">'+d[0]+'</div><div class="td">'+d[1]+'</div>';
 return a;
}
function render(){
 document.getElementById('h1').textContent=HEAD[lang].h1;
 document.getElementById('tag').textContent=HEAD[lang].tag;
 document.getElementById('foot').innerHTML=HEAD[lang].foot;
 document.getElementById('aboutH2').textContent=HEAD[lang].aboutH2;
 document.getElementById('aboutP').textContent=HEAD[lang].aboutP;
 document.getElementById('turmaM2').querySelector('span:last-child').textContent=HEAD[lang].m2;
 document.getElementById('turmaP2').querySelector('span:last-child').textContent=HEAD[lang].p2;
 document.getElementById('turmaM2').classList.toggle('on',turma==='m2');
 document.getElementById('turmaP2').classList.toggle('on',turma==='p2');
 if(window.mascoteHtml){
  document.getElementById('faceM2').innerHTML=window.mascoteHtml('m2',28);
  document.getElementById('faceP2').innerHTML=window.mascoteHtml('p2',28);
 }
 var grid=document.getElementById('grid');grid.innerHTML='';
 if(turma){
  var mine=TILES.filter(function(t){return t.turma===turma;});
  var h1=document.createElement('div');h1.className='secttl';
  h1.innerHTML=(window.mascoteHtml?window.mascoteHtml(turma,26):'')+'<span>'+HEAD[lang].sectRec+'</span>';
  grid.appendChild(h1);
  mine.forEach(function(t){grid.appendChild(tile(t));});
  document.getElementById('turmaHint').textContent=HEAD[lang].hintOn+HEAD[lang][turma];
 } else {
  TILES.forEach(function(t){grid.appendChild(tile(t));});
  document.getElementById('turmaHint').textContent=HEAD[lang].hintOff;
 }
 var lb=document.getElementById('langBtn');
 lb.querySelector('.pt').classList.toggle('on',lang==='pt');
 lb.querySelector('.en').classList.toggle('on',lang==='en');
 document.documentElement.setAttribute('data-profile',profile);
 renderToday();renderStickers();renderParentCtl();
}
if(getCalm())document.documentElement.setAttribute('data-calm','');
document.getElementById('langBtn').onclick=function(){lang=lang==='pt'?'en':'pt';setLang(lang);render();};
document.getElementById('infoBtn').onclick=function(){document.getElementById('aboutSheet').classList.add('show');};
document.getElementById('closeAbout').onclick=function(){document.getElementById('aboutSheet').classList.remove('show');};
document.getElementById('aboutSheet').onclick=function(e){if(e.target.id==='aboutSheet')e.target.classList.remove('show');};
[document.getElementById('turmaM2'),document.getElementById('turmaP2')].forEach(function(btn){
 btn.onclick=function(){
  var t=btn.dataset.t;
  turma = turma===t ? '' : t;
  setTurma(turma);
  render();
 };
});
render();
</script>
</body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>Jogos da Bibel</title><meta name="description" content="Coleção de joguinhos de alfabetização para crianças, feitos com IA."><meta property="og:title" content="Jogos da Bibel"><meta property="og:description" content="Joguinhos de alfabetização feitos com IA."><meta property="og:image" content="https://www.thiagopatente.com.br/jogo/og.png"><meta property="og:type" content="website"><meta property="og:url" content="https://www.thiagopatente.com.br/jogo/"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://www.thiagopatente.com.br/jogo/og.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"><script src="assets/mascotes.js"></script><style>
.head{text-align:center;padding:18px 0 6px}.head .k{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--coral);font-weight:600}
.head h1{font-size:clamp(40px,12vw,64px)}.head p{color:#7a6f5c;font-size:17px}
.turmabar{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 4px;flex-wrap:wrap}
.turmabtn{border:3px solid #efe7d8;background:#fff;border-radius:999px;padding:12px 20px;font-family:inherit;font-weight:700;font-size:16px;color:var(--tinta);cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 0 rgba(124,36,16,.10)}
.turmabtn:active{transform:translateY(2px)}
.turmabtn.on{background:var(--coral);color:#fff;border-color:var(--coral)}
.turmaface{display:inline-flex;margin-right:2px}
.turmahint{text-align:center;color:#8a7f6c;font-size:13px;margin:2px 0 0}
.secttl{font-weight:700;font-size:14px;color:var(--terra);text-transform:uppercase;letter-spacing:.06em;margin:22px 4px 8px;grid-column:1/-1;display:flex;align-items:center;gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
@media(min-width:560px){.grid2{grid-template-columns:1fr 1fr 1fr}}
.tile{background:#fff;border:3px solid #efe7d8;border-radius:22px;padding:18px 12px;text-align:center;text-decoration:none;color:var(--tinta);box-shadow:0 5px 0 rgba(124,36,16,.10)}
.tile:active{transform:translateY(2px)}.tile .te{font-size:46px}.tile .tt{font-weight:700;font-size:19px;color:var(--terra);margin-top:6px}.tile .td{font-size:13px;color:#8a7f6c;margin-top:2px;line-height:1.3}
.foot{text-align:center;color:#8a7f6c;font-size:13px;margin:26px 0 10px}
.profilebar{display:flex;align-items:center;justify-content:center;gap:10px;margin:20px 0 2px;flex-wrap:wrap}
.profilebar .lbl{font-size:13px;color:#8a7f6c;font-weight:600}
.agebtn{border:3px solid #efe7d8;background:#fff;border-radius:999px;width:36px;height:36px;font-weight:700;font-size:14px;color:#8a7f6c;cursor:pointer}
.agebtn.on{background:var(--coral);color:#fff;border-color:var(--coral)}
</style></head><body>
<button class="lang-btn" id="langBtn" aria-label="Português / English" style="position:fixed;top:12px;right:12px"><span class="flag pt on"></span><span class="flag en"></span></button>
<button class="info-btn" id="infoBtn" aria-label="Sobre" style="position:fixed;top:12px;left:12px">ⓘ</button>
<div class="sheet" id="aboutSheet">
 <div class="sheetcard">
  <button class="closex" id="closeAbout">✕</button>
  <div class="big">🧸</div>
  <h2 id="aboutH2">Sobre</h2>
  <p id="aboutP"></p>
 </div>
</div>
<div class="wrap">
 <div class="head"><div class="k">Jogos da Bibel</div><h1 id="h1">Aprender brincando</h1><p id="tag">joguinhos de alfabetização, feitos com IA</p></div>
 <div class="turmabar">
  <button class="turmabtn" id="turmaM2" data-t="m2"><span class="turmaface" id="faceM2"></span><span></span></button>
  <button class="turmabtn" id="turmaP2" data-t="p2"><span class="turmaface" id="faceP2"></span><span></span></button>
 </div>
 <p class="turmahint" id="turmaHint"></p>
 <div class="grid2" id="grid"></div>
 <div class="profilebar">
  <span class="lbl" id="profileLbl">toque maior pra mãozinha pequena?</span>
  <button class="agebtn" id="ageP3" data-p="p3">3</button>
  <button class="agebtn" id="ageP5" data-p="p5">5</button>
 </div>
 <div class="foot" id="foot">Feito por Thiago Patente, para as duas filhas. · <a href="https://www.thiagopatente.com.br" style="color:var(--terra)">thiagopatente.com.br</a></div>
</div>
<script>
var TILES=[
 {turma:"p2",href:"copa/",e:"🏆",pt:["Bia e as Bandeiras do Mundo","memória das bandeiras do mundo"],en:["Bia and the World Flags","world flags memory match"]},
 // Maternal II
 {turma:"m2",href:"cores/",e:"🎨",pt:["As Cores","toque na cor que eu falar"],en:["Colors","touch the color I say"]},
 {turma:"m2",href:"contar/",e:"🔢",pt:["Conta os Bichos","conte e toque no número certo"],en:["Count the Animals","count and touch the right number"]},
 {turma:"m2",href:"diferente/",e:"🍎🍎🍌",pt:["Qual é Diferente","toque no que é diferente"],en:["Odd One Out","touch the one that's different"]},
 {turma:"m2",href:"sombras/",e:"🦆🌑",pt:["A Sombra Certa","ache cada figura e a sua sombra"],en:["Right Shadow","match each picture to its shadow"]},
 {turma:"m2",href:"sequencia/",e:"1️⃣2️⃣3️⃣",pt:["A Sequência","coloque os números em ordem"],en:["The Sequence","put the numbers in order"]},
 {turma:"m2",href:"tamanhos/",e:"📏",pt:["Tamanhos","toque no maior ou no menor"],en:["Sizes","touch the bigger or smaller one"]},
 {turma:"m2",href:"sons-dos-bichos/",e:"🐮",pt:["Sons dos Bichos","toque no bicho que faz o som"],en:["Animal Sounds","touch the animal that makes the sound"]},
 {turma:"m2",href:"formas/",e:"🔺",pt:["Formas","toque na forma certa"],en:["Shapes","touch the right shape"]},
 {turma:"m2",href:"opostos/",e:"⚖️",pt:["Opostos","qual é o oposto?"],en:["Opposites","what is the opposite?"]},
 {turma:"m2",href:"partes-do-corpo/",e:"🧑",pt:["Partes do Corpo","toque na parte certa do corpo"],en:["Body Parts","touch the right body part"]},
 {turma:"m2",href:"emocoes/",e:"😀",pt:["Emoções","toque em quem está sentindo isso"],en:["Feelings","touch the one feeling that way"]},
 {turma:"m2",href:"rotina/",e:"☀️",pt:["Rotina","manhã, tarde ou noite?"],en:["Daily Routine","morning, afternoon or night?"]},
 // Pré II
 {turma:"p2",href:"rimas/",e:"🦆🐱",pt:["As Rimas","memória das palavras que rimam"],en:["Rhymes","memory match of rhyming words"]},
 {turma:"p2",href:"som-da-letra/",e:"🔤",pt:["O Som da Letra","qual figura começa com a letra"],en:["Letter Sound","which picture starts with the letter"]},
 {turma:"p2",href:"primeira-letra/",e:"🅰️",pt:["A Primeira Letra","com que letra a palavra começa"],en:["First Letter","which letter the word starts with"]},
 {turma:"p2",href:"silabas/",e:"🍌",pt:["Monta a Sílaba","junte as sílabas e forme a palavra"],en:["Build the Syllable","put the syllables together"]},
 {turma:"p2",href:"caca-letra/",e:"🔎",pt:["Caça à Letra","toque em todas as letras iguais"],en:["Letter Hunt","touch all the matching letters"]},
 {turma:"p2",href:"padroes/",e:"🔴🔵",pt:["Padrões","complete o padrão"],en:["Patterns","complete the pattern"]},
 {turma:"p2",href:"soma-facil/",e:"➕",pt:["Soma Fácil","conte e responda"],en:["Easy Addition","count and answer"]},
 {turma:"p2",href:"qual-palavra/",e:"🔤",pt:["Qual Palavra?","escolha a palavra certa"],en:["Word Match","pick the right word"]},
 {turma:"p2",href:"maior-grupo/",e:"🔢",pt:["Maior Grupo","compare as quantidades"],en:["Which Group Has More","compare the quantities"]},
 {turma:"p2",href:"ingles-pra-figura/",e:"🔤",pt:["Do Inglês pra Figura","ouça em inglês e toque na figura certa"],en:["English by Ear","listen in English and touch the right picture"]}
];
var HEAD={pt:{h1:"Aprender brincando",tag:"joguinhos de alfabetização, feitos com IA",foot:'Feito por Thiago Patente, para as duas filhas. · <a href="https://www.thiagopatente.com.br" style="color:var(--terra)">thiagopatente.com.br</a>',profileLbl:"toque maior pra mãozinha pequena?",m2:"Maternal II",p2:"Pré II",hintOn:"mostrando só os jogos da ",hintOff:"toque numa turma pra ver só os jogos dela.",sectRec:"recomendados pra essa turma",sectOther:"outros jogos",aboutH2:"Sobre os Jogos da Bibel",aboutP:"Uma coleção de 20 joguinhos de alfabetização e matemática, feitos por Thiago Patente com IA, pra suas duas filhas praticarem em português e inglês no celular. Nada de anúncio, nada de cadastro, é só brincar."},
 en:{h1:"Learn by playing",tag:"early learning games, made with AI",foot:'Made by Thiago Patente, for his two daughters. · <a href="https://www.thiagopatente.com.br" style="color:var(--terra)">thiagopatente.com.br</a>',profileLbl:"bigger buttons for a little hand?",m2:"Maternal II",p2:"Pre II",hintOn:"showing only games for ",hintOff:"tap a class to see only its games.",sectRec:"recommended for this class",sectOther:"other games",aboutH2:"About Jogos da Bibel",aboutP:"A collection of 20 early literacy and math games, made by Thiago Patente with AI, for his two daughters to practice in Portuguese and English on the phone. No ads, no sign-up, just play."}};
function getLang(){try{return localStorage.getItem('bibel_lang')||'pt';}catch(e){return 'pt';}}
function setLang(l){try{localStorage.setItem('bibel_lang',l);}catch(e){}}
function getProfile(){try{return localStorage.getItem('bibel_profile')||'';}catch(e){return '';}}
function setProfile(p){try{if(p)localStorage.setItem('bibel_profile',p);else localStorage.removeItem('bibel_profile');}catch(e){}}
function getTurma(){try{return localStorage.getItem('bibel_turma')||'';}catch(e){return '';}}
function setTurma(t){try{if(t)localStorage.setItem('bibel_turma',t);else localStorage.removeItem('bibel_turma');}catch(e){}}
var lang=getLang();
var profile=getProfile();
var turma=getTurma();
function tile(t){
 var d=t[lang];
 var a=document.createElement('a');a.className='tile';a.href=t.href;
 a.innerHTML='<div class="te">'+t.e+'</div><div class="tt">'+d[0]+'</div><div class="td">'+d[1]+'</div>';
 return a;
}
function render(){
 document.getElementById('h1').textContent=HEAD[lang].h1;
 document.getElementById('tag').textContent=HEAD[lang].tag;
 document.getElementById('foot').innerHTML=HEAD[lang].foot;
 document.getElementById('profileLbl').textContent=HEAD[lang].profileLbl;
 document.getElementById('aboutH2').textContent=HEAD[lang].aboutH2;
 document.getElementById('aboutP').textContent=HEAD[lang].aboutP;
 document.getElementById('turmaM2').querySelector('span:last-child').textContent=HEAD[lang].m2;
 document.getElementById('turmaP2').querySelector('span:last-child').textContent=HEAD[lang].p2;
 document.getElementById('turmaM2').classList.toggle('on',turma==='m2');
 document.getElementById('turmaP2').classList.toggle('on',turma==='p2');
 if(window.mascoteHtml){
  document.getElementById('faceM2').innerHTML=window.mascoteHtml('m2',28);
  document.getElementById('faceP2').innerHTML=window.mascoteHtml('p2',28);
 }
 var grid=document.getElementById('grid');grid.innerHTML='';
 if(turma){
  var mine=TILES.filter(function(t){return t.turma===turma;});
  var h1=document.createElement('div');h1.className='secttl';
  h1.innerHTML=(window.mascoteHtml?window.mascoteHtml(turma,26):'')+'<span>'+HEAD[lang].sectRec+'</span>';
  grid.appendChild(h1);
  mine.forEach(function(t){grid.appendChild(tile(t));});
  document.getElementById('turmaHint').textContent=HEAD[lang].hintOn+HEAD[lang][turma];
 } else {
  TILES.forEach(function(t){grid.appendChild(tile(t));});
  document.getElementById('turmaHint').textContent=HEAD[lang].hintOff;
 }
 var lb=document.getElementById('langBtn');
 lb.querySelector('.pt').classList.toggle('on',lang==='pt');
 lb.querySelector('.en').classList.toggle('on',lang==='en');
 document.getElementById('ageP3').classList.toggle('on',profile==='p3');
 document.getElementById('ageP5').classList.toggle('on',profile==='p5');
 document.documentElement.setAttribute('data-profile',profile);
}
document.getElementById('langBtn').onclick=function(){lang=lang==='pt'?'en':'pt';setLang(lang);render();};
document.getElementById('infoBtn').onclick=function(){document.getElementById('aboutSheet').classList.add('show');};
document.getElementById('closeAbout').onclick=function(){document.getElementById('aboutSheet').classList.remove('show');};
document.getElementById('aboutSheet').onclick=function(e){if(e.target.id==='aboutSheet')e.target.classList.remove('show');};
[document.getElementById('turmaM2'),document.getElementById('turmaP2')].forEach(function(btn){
 btn.onclick=function(){
  var t=btn.dataset.t;
  turma = turma===t ? '' : t;
  setTurma(turma);
  render();
 };
});
[document.getElementById('ageP3'),document.getElementById('ageP5')].forEach(function(btn){
 btn.onclick=function(){
  var p=btn.dataset.p;
  profile = profile===p ? '' : p;
  setProfile(profile);
  render();
 };
});
render();
</script>
</body></html>
